<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intercom Panel Requests</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>Intercom Panel Requests</h1>
  <button id="logout" class="hidden">Log out</button>
</header>

<main>
  <div id="brands" class="brands">
    <img src="/img/nascar.png" alt="NASCAR">
    <img src="/img/imsa.jpg" alt="IMSA">
  </div>
  <!-- Login -->
  <section id="login" class="card login hidden">
    <h2>Log in</h2>
    <form id="loginForm">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" autofocus>
      <div class="error" id="loginError"></div>
      <button class="primary" style="width:100%;margin-top:8px">Log in</button>
    </form>
  </section>

  <!-- Position list -->
  <section id="list" class="hidden">
    <div class="card">
      <div id="crumbs" class="crumbs hidden"></div>
      <h2 id="listTitle">Pick your show</h2>
      <div id="positions" class="positions"></div>
    </div>
    <div class="card hidden" id="photosCard">
      <h2>Reference photos</h2>
      <div class="photos" id="photos"></div>
    </div>
  </section>

  <!-- Editor -->
  <section id="editor" class="hidden">
    <div class="row" style="margin-bottom:12px">
      <button id="back">← Positions</button>
      <div style="flex:1">
        <div id="posPath" class="muted"></div>
        <h2 id="posName" style="margin:0"></h2>
      </div>
      <span id="posStatus"></span>
    </div>
    <div class="editor-grid">
      <div>
        <div class="card">
          <div class="row" style="margin-bottom:12px">
            <p class="muted" style="margin:0;flex:1">Click a key to set what it should say and do</p>
            <span id="undoBar" class="hidden muted">All keys cleared. <button id="undoClear">Undo</button></span>
            <button id="clearAll" class="danger">Clear whole panel</button>
          </div>
          <div id="rack"></div>
        </div>
      </div>
      <div class="side">
        <div class="card keyform">
          <h2 id="keyTitle">Key</h2>
          <label for="kLabel">Label on the display (up to <span id="labelMax">8</span> characters)</label>
          <input id="kLabel" type="text" maxlength="8" placeholder="e.g. PRODUCER">
          <div class="row" style="margin-top:10px">
            <button id="prevKey">← Prev</button>
            <button id="nextKey">Next →</button>
            <button id="clearKey" class="danger" style="margin-left:auto">Clear key</button>
          </div>
        </div>
        <div class="card">
          <label for="contact" style="margin-top:0">Your name</label>
          <input id="contact" type="text" placeholder="Who's filling this out">
          <label for="notes">Anything else Stefan should know</label>
          <textarea id="notes" rows="3"></textarea>
          <div class="muted" id="saveState" style="margin-top:8px">&nbsp;</div>
          <button id="submit" class="primary" style="width:100%;margin-top:8px">Submit, ready to program</button>
          <div class="error" id="submitError"></div>
        </div>
      </div>
    </div>
    <div class="card hidden" id="photosCard2">
      <h2>Reference photos</h2>
      <div class="photos" id="photos2"></div>
    </div>
  </section>
</main>

<script src="/common.js"></script>
<script src="/app.js"></script>
</body>
</html>
